[package]
name = "marcel-ssh"
version = "0.6.0"
edition = "2021"
description = "AI-Native SSH Client with Autonomous Agent Operations"
rust-version = "1.77.2"

[lib]
# cdylib is required for the Android build (libmarcel_ssh.so); rlib keeps the
# desktop binary and tests working; staticlib is for iOS.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2", features = [] }



[dependencies]
tauri = { version = "^2", features = ["tray-icon", "unstable", "protocol-asset"] }
tauri-plugin-shell = "^2"
tauri-plugin-notification = "^2"
tauri-plugin-clipboard-manager = "^2"
tauri-plugin-dialog = "^2"
tauri-plugin-fs = "^2"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
tokio = { version = "^1", features = ["full"] }
thiserror = "^2"
uuid = { version = "^1", features = ["v4", "serde"] }
log = "^0.4"
env_logger = "^0.11"
chrono = { version = "^0.4", features = ["serde"] }
async-trait = "^0.1"
russh = { version = "0.60", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.1"
zeroize = { version = "^1", features = ["derive"] }
futures = "^0.3"
html2md = "^0.2"
parking_lot = "^0.12"
scraper = "^0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = "^2"
serde_yaml = "^0.9"
base64 = "^0.22"
shell-words = "^1.1"
url = "2"
dirs = "^5"
semver = "^1"
handlebars = "6"
# 跨设备同步 E2E 加密：纯 Rust crate，无平台差异，桌面/Android 共用
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"




# reqwest TLS 后端按平台拆分：桌面用系统原生 TLS；Android 交叉编译没有 OpenSSL，用 rustls。
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "^0.12", default-features = false, features = ["json", "stream", "native-tls", "charset", "gzip", "brotli", "deflate"] }
# 同步 WebSocket：桌面走系统 TLS
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "native-tls"] }
# 桌面密钥链：Windows Credential Manager / macOS+iOS Keychain / Linux Secret Service
keyring = { version = "^4", default-features = false, features = [
    "v1",
    "windows-native-keyring-store",
    "apple-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "^0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "gzip", "brotli", "deflate"] }
# 同步 WebSocket：Android 交叉编译用 rustls
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# Android 密钥链：SharedPreferences + Android Keystore（hardware-backed AES）
# v3 时代 keyring 在 Android 静默降级为内存 mock，重启即丢；
# v4 的 v1 便利模块仍不覆盖 Android，因此直接用官方 store + keyring-core 构建 Entry。
keyring-core = { version = "^1", features = [] }
android-native-keyring-store = { version = "^1", features = [] }
# content:// URI 的 DISPLAY_NAME 查询走 JNI ContentResolver（tauri 依赖树已有同版本）
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
tempfile = "^3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
