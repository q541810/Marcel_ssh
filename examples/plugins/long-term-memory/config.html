<!DOCTYPE html>
<!-- Task 10: 配置视图（当前连接 host:port、记忆条数、清除当前连接所有记忆按钮、上次清除时间元数据） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>长期记忆 - 配置</title>
<style>
  :root {
    --zinc-950: #09090b;
    --zinc-900: #18181b;
    --zinc-800: #27272a;
    --zinc-700: #3f3f46;
    --zinc-600: #52525b;
    --zinc-500: #71717a;
    --zinc-400: #a1a1aa;
    --zinc-300: #d4d4d8;
    --zinc-200: #e4e4e7;
    --zinc-100: #f4f4f5;
    --indigo-600: #4f46e5;
    --indigo-500: #6366f1;
    --indigo-400: #818cf8;
    --indigo-900-30: rgba(49,46,129,0.3);
    --red-600: #dc2626;
    --red-500: #ef4444;
    --red-400: #f87171;
    --red-500-15: rgba(239,68,68,0.15);
    --red-500-25: rgba(239,68,68,0.25);
    --red-500-05: rgba(239,68,68,0.05);
    --amber-400: #fbbf24;
    --amber-500-15: rgba(251,191,36,0.15);
    --amber-500-25: rgba(251,191,36,0.25);
    --emerald-400: #34d399;
    --emerald-500-15: rgba(52,211,153,0.15);
    --emerald-500-25: rgba(52,211,153,0.25);
    --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    --spring-smooth: cubic-bezier(0.22, 1, 0.36, 1);
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--zinc-900);
    color: var(--zinc-100);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 14px;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--zinc-700); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--zinc-600); }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── 顶部栏（仿主窗口 Modal header） ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--zinc-800);
    flex-shrink: 0;
  }
  .header-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .title {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--zinc-100);
  }
  .subtitle {
    font-size: 11px;
    color: var(--zinc-500);
  }

  /* ── 主体 ── */
  .body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }

  /* 区段标题 */
  .section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--zinc-500);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 4px 8px;
  }

  /* ── 信息卡片（仿 ListPanel） ── */
  .info-card {
    background: transparent;
    border: 1px solid var(--zinc-800);
    border-radius: var(--radius-md);
    padding: 4px 12px;
    margin-bottom: 12px;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
  }
  .info-row + .info-row {
    border-top: 1px solid var(--zinc-800);
  }
  .info-label {
    font-size: 12px;
    color: var(--zinc-500);
    flex-shrink: 0;
  }
  .info-value {
    font-size: 13px;
    color: var(--zinc-200);
    text-align: right;
    word-break: break-all;
  }
  .info-value.muted { color: var(--zinc-600); }
  .info-value.count {
    font-size: 15px;
    font-weight: 600;
    color: var(--zinc-100);
  }
  .info-value.count.zero { color: var(--zinc-500); }

  /* ── 危险区域 ── */
  .danger-zone {
    padding: 12px;
    background: var(--red-500-05);
    border: 1px solid var(--red-500-25);
    border-radius: var(--radius-md);
  }
  .danger-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--red-400);
    margin-bottom: 6px;
  }
  .danger-title svg {
    width: 14px;
    height: 14px;
  }
  .danger-desc {
    font-size: 12px;
    color: var(--zinc-400);
    margin-bottom: 10px;
    line-height: 1.5;
  }
  .danger-desc code {
    background: var(--zinc-800);
    color: var(--zinc-300);
    padding: 1px 5px;
    border-radius: var(--radius-sm);
    font-family: 'SFMono-Regular', Consolas, monospace;
    font-size: 11px;
  }

  /* 二次确认条 */
  .confirm-bar {
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--red-500-15);
    border: 1px solid var(--red-500-25);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .confirm-bar-text {
    color: #fecaca;
    font-size: 12px;
    line-height: 1.5;
  }
  .confirm-bar-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  /* ── 按钮（仿 Button.tsx） ── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border-radius: var(--radius-md);
    font-weight: 500;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid transparent;
    padding: 5px 12px;
    transition: background-color 150ms var(--spring-bounce),
                border-color 150ms var(--spring-bounce),
                color 150ms var(--spring-bounce),
                transform 150ms var(--spring-bounce);
  }
  .btn:active { transform: scale(0.95); }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  .btn-secondary {
    background: var(--zinc-700);
    color: var(--zinc-200);
  }
  .btn-secondary:hover:not(:disabled) { background: var(--zinc-600); }
  .btn-primary {
    background: var(--indigo-600);
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) { background: var(--indigo-500); }
  .btn-danger {
    background: var(--red-600);
    color: #fff;
  }
  .btn-danger:hover:not(:disabled) { background: var(--red-500); }
  .btn-ghost {
    background: transparent;
    color: var(--zinc-300);
    border-color: var(--zinc-700);
  }
  .btn-ghost:hover:not(:disabled) {
    background: var(--zinc-800);
    color: var(--zinc-100);
  }

  /* ── 状态提示条 ── */
  .status-bar {
    margin-top: 10px;
    padding: 8px 12px;
    font-size: 12px;
    border-radius: var(--radius-md);
    display: none;
    line-height: 1.5;
  }
  .status-bar.info {
    background: var(--indigo-900-30);
    color: var(--indigo-400);
    display: block;
  }
  .status-bar.success {
    background: var(--emerald-500-15);
    color: var(--emerald-400);
    display: block;
  }
  .status-bar.warn {
    background: var(--amber-500-15);
    color: var(--amber-400);
    display: block;
  }
  .status-bar.error {
    background: var(--red-500-15);
    color: var(--red-400);
    display: block;
  }

  /* ── 底部 ── */
  .footer {
    padding: 10px 16px;
    border-top: 1px solid var(--zinc-800);
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    flex-shrink: 0;
  }

  /* ── loading ── */
  .loading {
    text-align: center;
    color: var(--zinc-500);
    padding: 24px 16px;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="app">
  <!-- 顶部栏 -->
  <div class="header">
    <div class="header-left">
      <h3 class="title">长期记忆 · 配置</h3>
      <span class="subtitle">管理当前连接的记忆数据</span>
    </div>
  </div>

  <!-- 主体 -->
  <div class="body">
    <div id="content">
      <div class="loading">加载中…</div>
    </div>
  </div>

  <!-- 底部 -->
  <div class="footer">
    <button class="btn btn-primary" id="done-btn" type="button">完成</button>
  </div>
</div>

<script>
'use strict';
(function () {
  const { emit, listen } = window.__TAURI__.event;
  const PLUGIN_ID = 'long-term-memory';
  let counter = 0;

  function pluginCall(cmd, args) {
    args = args || {};
    const id = String(++counter);
    return new Promise((resolve, reject) => {
      let unlistenFn = null;
      listen('plugin-response-' + id, function (e) {
        if (unlistenFn) { try { unlistenFn(); } catch (_) {} }
        if (e.payload && e.payload.ok) resolve(e.payload.data);
        else reject(new Error(e.payload ? e.payload.data : 'unknown error'));
      }).then(function (unl) {
        unlistenFn = unl;
        return emit('plugin-request', {
          id: id,
          pluginId: PLUGIN_ID,
          cmd: cmd,
          args: args
        });
      }).catch(reject);
    });
  }

  const state = {
    host: null,
    port: null,
    hostPort: null,
    connName: '',
    count: -1,
    lastClearedAt: null,
    confirming: false,
    clearing: false
  };

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatTimestamp(ts) {
    if (!ts) return '从未';
    const d = new Date(ts * 1000);
    const pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function countJsonl(text) {
    if (!text || !text.trim()) return 0;
    const lines = text.split('\n');
    let n = 0;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (!line || !line.trim()) continue;
      try {
        const obj = JSON.parse(line);
        if (obj && typeof obj === 'object') n++;
      } catch (_) {}
    }
    return n;
  }

  function getCurrentConnection() {
    return pluginCall('session.active').then(function (sess) {
      if (!sess || !sess.connectionId) throw new Error('no active session');
      return pluginCall('connection.info', { connectionId: sess.connectionId }).then(function (conn) {
        if (!conn || !conn.host) throw new Error('no connection info');
        return {
          host: conn.host,
          port: conn.port,
          name: conn.name || (conn.host + ':' + conn.port)
        };
      });
    });
  }
  function buildHostPort(conn) { return String(conn.host) + '_' + String(conn.port); }
  function readMemoriesFile(hostPort) { return pluginCall('fs.read', { path: 'memories/' + hostPort + '.jsonl' }); }
  function writeMemoriesFile(hostPort, content) { return pluginCall('fs.write', { path: 'memories/' + hostPort + '.jsonl', content: content }); }
  function readConfig() {
    return pluginCall('config.read').then(function (text) {
      if (!text) return {};
      try { return JSON.parse(text) || {}; } catch (_) { return {}; }
    }, function () { return {}; });
  }
  function writeConfig(config) { return pluginCall('config.write', { content: JSON.stringify(config, null, 2) }); }
  function notifySavedAndClose() { return pluginCall('config.saved'); }

  const elContent = document.getElementById('content');

  function setStatus(type, msg) {
    const el = document.getElementById('status-bar');
    if (!el) return;
    el.className = 'status-bar' + (type ? ' ' + type : '');
    el.textContent = msg || '';
  }

  function render() {
    const hp = state.hostPort;
    const hasConn = !!hp;
    const countText = state.count < 0
      ? '加载中…'
      : (state.count === 0 ? '0 条' : state.count + ' 条');
    const countClass = state.count === 0 ? 'info-value count zero' : 'info-value count';

    let html = '';

    // 信息区段
    html += '<div class="section-title">当前连接</div>';
    html += '<div class="info-card">';
    html += '<div class="info-row">';
    html += '<span class="info-label">连接</span>';
    html += '<span class="info-value' + (hasConn ? '' : ' muted') + '">' +
      (hasConn ? escapeHtml(state.connName) + '（' + escapeHtml(state.host) + ':' + escapeHtml(state.port) + '）' : '未连接') +
      '</span>';
    html += '</div>';
    html += '<div class="info-row">';
    html += '<span class="info-label">记忆条数</span>';
    html += '<span class="' + countClass + '">' + escapeHtml(countText) + '</span>';
    html += '</div>';
    html += '<div class="info-row">';
    html += '<span class="info-label">上次清除</span>';
    html += '<span class="info-value' + (state.lastClearedAt ? '' : ' muted') + '">' +
      escapeHtml(formatTimestamp(state.lastClearedAt)) + '</span>';
    html += '</div>';
    html += '</div>';

    // 危险操作区
    html += '<div class="section-title">危险操作</div>';
    html += '<div class="danger-zone">';
    html += '<div class="danger-title">';
    html += '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M5 19h14a2 2 0 001.7-3L13.7 4a2 2 0 00-3.4 0L3.3 16A2 2 0 005 19z"/></svg>';
    html += '清除当前连接记忆</div>';
    html += '<div class="danger-desc">清除 <code>' + (hasConn ? escapeHtml(state.hostPort) : '未连接') + '</code> 的所有记忆。此操作不可恢复，清除后 Agent 将无法再 recall 这台机器之前的记忆。</div>';
    html += '<button class="btn btn-danger" id="clear-btn" type="button"' +
      (!hasConn || state.count === 0 || state.clearing ? ' disabled' : '') + '>清除当前连接所有记忆</button>';
    if (state.confirming) {
      html += '<div class="confirm-bar">';
      html += '<span class="confirm-bar-text">确认清除 <code style="background:rgba(0,0,0,0.3);padding:1px 5px;border-radius:4px;font-family:monospace;font-size:11px">' + escapeHtml(state.hostPort) + '</code> 的所有记忆？共 ' +
        state.count + ' 条，清除后不可恢复。</span>';
      html += '<div class="confirm-bar-actions">';
      html += '<button class="btn btn-ghost" id="cancel-clear" type="button">取消</button>';
      html += '<button class="btn btn-danger" id="confirm-clear" type="button">确认清除</button>';
      html += '</div>';
      html += '</div>';
    }
    html += '</div>';

    // 状态提示条
    html += '<div class="status-bar" id="status-bar"></div>';

    elContent.innerHTML = html;
    bindActions();
  }

  function bindActions() {
    const clearBtn = document.getElementById('clear-btn');
    if (clearBtn) clearBtn.addEventListener('click', function () {
      if (state.clearing) return;
      state.confirming = true;
      setStatus('', '');
      render();
    });

    const cancelBtn = document.getElementById('cancel-clear');
    if (cancelBtn) cancelBtn.addEventListener('click', function () {
      state.confirming = false;
      render();
    });

    const confirmBtn = document.getElementById('confirm-clear');
    if (confirmBtn) confirmBtn.addEventListener('click', performClear);
  }

  function performClear() {
    if (state.clearing) return;
    if (!state.hostPort) {
      setStatus('error', '没有当前连接，无法清除');
      return;
    }
    state.clearing = true;
    state.confirming = false;
    render();
    setStatus('info', '正在清除…');

    const hostPort = state.hostPort;
    writeMemoriesFile(hostPort, '').then(function () {
      return readConfig().then(function (config) {
        const now = Math.floor(Date.now() / 1000);
        if (!config.lastClearedAt || typeof config.lastClearedAt !== 'object') {
          config.lastClearedAt = {};
        }
        config.lastClearedAt[hostPort] = now;
        return writeConfig(config).then(function () { return now; });
      });
    }).then(function (now) {
      state.count = 0;
      state.lastClearedAt = now;
      state.clearing = false;
      render();
      setStatus('success', '已清除全部记忆（' + hostPort + '）');
      setTimeout(function () {
        notifySavedAndClose().catch(function () {
          setStatus('warn', '清除已完成，但关闭弹窗失败，请手动关闭。');
        });
      }, 800);
    }).catch(function (err) {
      state.clearing = false;
      render();
      setStatus('error', '清除失败：' + (err && err.message ? err.message : err));
    });
  }

  function loadAll() {
    return getCurrentConnection().then(function (conn) {
      state.host = conn.host;
      state.port = conn.port;
      state.hostPort = buildHostPort(conn);
      state.connName = conn.name;
      return Promise.all([
        readMemoriesFile(state.hostPort).then(function (text) {
          state.count = countJsonl(text);
        }, function () { state.count = 0; }),
        readConfig().then(function (config) {
          if (config.lastClearedAt && typeof config.lastClearedAt === 'object') {
            state.lastClearedAt = config.lastClearedAt[state.hostPort] || null;
          } else {
            state.lastClearedAt = null;
          }
        })
      ]);
    }, function (err) {
      state.host = null;
      state.port = null;
      state.hostPort = null;
      state.connName = '';
      state.count = -1;
      state.lastClearedAt = null;
      throw err;
    }).then(function () { render(); });
  }

  function init() {
    loadAll().then(function () {}).catch(function () {
      render();
      setStatus('warn', '未检测到活跃的 SSH 连接。请先连接服务器再管理记忆。');
    });
  }

  document.getElementById('done-btn').addEventListener('click', function () {
    notifySavedAndClose().catch(function () {
      setStatus('warn', '关闭弹窗失败，请按 ESC 或点击遮罩关闭。');
    });
  });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
