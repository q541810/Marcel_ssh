<!DOCTYPE html>
<!-- Task 10: 配置视图（当前连接 host:port、记忆条数、清除当前连接所有记忆按钮、上次清除时间元数据） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>长期记忆 - 配置</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #18181b;
    color: #e4e4e7;
    font-family: sans-serif;
    font-size: 14px;
    height: 100vh;
    overflow: hidden;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  /* 顶部标题栏 */
  .header {
    padding: 16px 20px;
    border-bottom: 1px solid #3f3f46;
    flex-shrink: 0;
  }
  .title {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }
  .subtitle {
    margin-top: 4px;
    font-size: 12px;
    color: #71717a;
  }
  /* 主体 */
  .body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }
  .body::-webkit-scrollbar { width: 8px; }
  .body::-webkit-scrollbar-track { background: transparent; }
  .body::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
  .body::-webkit-scrollbar-thumb:hover { background: #52525b; }
  /* 信息卡片 */
  .info-card {
    background: #1f1f23;
    border: 1px solid #3f3f46;
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 6px 0;
  }
  .info-row + .info-row {
    border-top: 1px solid #27272a;
  }
  .info-label {
    font-size: 12px;
    color: #71717a;
    flex-shrink: 0;
  }
  .info-value {
    font-size: 13px;
    color: #e4e4e7;
    text-align: right;
    word-break: break-all;
  }
  .info-value.muted {
    color: #52525b;
  }
  .info-value.count {
    font-size: 15px;
    font-weight: 600;
    color: #e4e4e7;
  }
  .info-value.count.zero {
    color: #71717a;
  }
  /* 危险区域 */
  .danger-zone {
    margin-top: 20px;
    padding: 14px;
    background: #1f1f23;
    border: 1px solid #7f1d1d;
    border-radius: 6px;
  }
  .danger-title {
    font-size: 13px;
    font-weight: 600;
    color: #fca5a5;
    margin-bottom: 6px;
  }
  .danger-desc {
    font-size: 12px;
    color: #a1a1aa;
    margin-bottom: 10px;
    line-height: 1.5;
  }
  .danger-actions {
    display: flex;
    gap: 6px;
  }
  /* 按钮 */
  .btn {
    border: 1px solid #3f3f46;
    background: #27272a;
    color: #e4e4e7;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
  }
  .btn:hover { background: #3f3f46; }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn-danger {
    background: #dc2626;
    border-color: #dc2626;
    color: #fff;
  }
  .btn-danger:hover { background: #b91c1c; }
  .btn-danger:disabled {
    background: #7f1d1d;
    border-color: #7f1d1d;
  }
  .btn-primary {
    background: #4f46e5;
    border-color: #4f46e5;
    color: #fff;
  }
  .btn-primary:hover { background: #4338ca; }
  /* 二次确认条 */
  .confirm-bar {
    margin-top: 10px;
    padding: 10px;
    background: #7f1d1d;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .confirm-bar-text {
    color: #fecaca;
    font-size: 12px;
    line-height: 1.5;
  }
  .confirm-bar-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  /* 状态提示 */
  .status-bar {
    margin-top: 10px;
    padding: 8px 10px;
    font-size: 12px;
    border-radius: 6px;
    display: none;
    line-height: 1.5;
  }
  .status-bar.info {
    background: #1e3a8a;
    color: #bfdbfe;
    display: block;
  }
  .status-bar.success {
    background: #14532d;
    color: #bbf7d0;
    display: block;
  }
  .status-bar.warn {
    background: #713f12;
    color: #fde68a;
    display: block;
  }
  .status-bar.error {
    background: #7f1d1d;
    color: #fecaca;
    display: block;
  }
  /* 底部 */
  .footer {
    padding: 12px 20px;
    border-top: 1px solid #3f3f46;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-shrink: 0;
  }
  /* 加载占位 */
  .loading {
    text-align: center;
    color: #71717a;
    padding: 20px;
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="app">
  <!-- 顶部标题 -->
  <div class="header">
    <h3 class="title">长期记忆 - 配置</h3>
    <div class="subtitle">管理当前连接的记忆数据</div>
  </div>

  <!-- 主体 -->
  <div class="body">
    <div id="content">
      <div class="loading">加载中…</div>
    </div>
  </div>

  <!-- 底部 -->
  <div class="footer">
    <button class="btn btn-primary" id="done-btn" type="button">完成</button>
  </div>
</div>

<script>
'use strict';
(function () {
  const { emit, listen } = window.__TAURI__.event;
  const PLUGIN_ID = 'long-term-memory';
  let counter = 0;

  // ============ IPC 封装 ============
  function pluginCall(cmd, args) {
    args = args || {};
    const id = String(++counter);
    return new Promise((resolve, reject) => {
      let unlistenFn = null;
      listen('plugin-response-' + id, function (e) {
        if (unlistenFn) { try { unlistenFn(); } catch (_) {} }
        if (e.payload && e.payload.ok) resolve(e.payload.data);
        else reject(new Error(e.payload ? e.payload.data : 'unknown error'));
      }).then(function (unl) {
        unlistenFn = unl;
        return emit('plugin-request', {
          id: id,
          pluginId: PLUGIN_ID,
          cmd: cmd,
          args: args
        });
      }).catch(reject);
    });
  }

  // ============ 状态 ============
  const state = {
    host: null,
    port: null,
    hostPort: null,         // `${host}_${port}`
    connName: '',
    count: -1,              // -1 = 未加载，0 = 空，>0 = 有条数
    lastClearedAt: null,    // Unix 秒
    confirming: false,      // 是否处于二次确认态
    clearing: false         // 清除中（防重复点击）
  };

  // ============ 工具函数 ============
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatTimestamp(ts) {
    if (!ts) return '从未';
    const d = new Date(ts * 1000);
    const pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  // JSONL 解析统计条数（解析失败的行跳过但不计入）
  function countJsonl(text) {
    if (!text || !text.trim()) return 0;
    const lines = text.split('\n');
    let n = 0;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (!line || !line.trim()) continue;
      try {
        const obj = JSON.parse(line);
        if (obj && typeof obj === 'object') n++;
      } catch (_) {
        // 跳过格式错误的行
      }
    }
    return n;
  }

  // ============ 数据流 ============
  // session.active → { sessionId, connectionId }
  // connection.info { connectionId } → { host, port, name }
  function getCurrentConnection() {
    return pluginCall('session.active').then(function (sess) {
      if (!sess || !sess.connectionId) {
        throw new Error('no active session');
      }
      return pluginCall('connection.info', { connectionId: sess.connectionId }).then(function (conn) {
        if (!conn || !conn.host) throw new Error('no connection info');
        return {
          host: conn.host,
          port: conn.port,
          name: conn.name || (conn.host + ':' + conn.port)
        };
      });
    });
  }

  function buildHostPort(conn) {
    return String(conn.host) + '_' + String(conn.port);
  }

  function readMemoriesFile(hostPort) {
    return pluginCall('fs.read', { path: 'memories/' + hostPort + '.jsonl' });
  }

  function writeMemoriesFile(hostPort, content) {
    return pluginCall('fs.write', { path: 'memories/' + hostPort + '.jsonl', content: content });
  }

  // config.read → 解析 config.json（容错：空/不存在/格式错误都返回 {}）
  function readConfig() {
    return pluginCall('config.read').then(function (text) {
      if (!text) return {};
      try { return JSON.parse(text) || {}; }
      catch (_) { return {}; }
    }, function () {
      // config.json 不存在时返回空对象
      return {};
    });
  }

  function writeConfig(config) {
    return pluginCall('config.write', { content: JSON.stringify(config, null, 2) });
  }

  function notifySavedAndClose() {
    return pluginCall('config.saved');
  }

  // ============ 渲染 ============
  const elContent = document.getElementById('content');

  function setStatus(type, msg) {
    const el = document.getElementById('status-bar');
    if (!el) return;
    el.className = 'status-bar' + (type ? ' ' + type : '');
    el.textContent = msg || '';
  }

  function render() {
    const hp = state.hostPort;
    const hasConn = !!hp;
    const countText = state.count < 0
      ? '加载中…'
      : (state.count === 0 ? '0 条' : state.count + ' 条');
    const countClass = state.count === 0 ? 'info-value count zero' : 'info-value count';

    let html = '';
    // 信息卡片
    html += '<div class="info-card">';
    html += '<div class="info-row">';
    html += '<span class="info-label">当前连接</span>';
    html += '<span class="info-value' + (hasConn ? '' : ' muted') + '">' +
      (hasConn ? escapeHtml(state.connName) + '（' + escapeHtml(state.host) + ':' + escapeHtml(state.port) + '）' : '未连接') +
      '</span>';
    html += '</div>';
    html += '<div class="info-row">';
    html += '<span class="info-label">记忆条数</span>';
    html += '<span class="' + countClass + '">' + escapeHtml(countText) + '</span>';
    html += '</div>';
    html += '<div class="info-row">';
    html += '<span class="info-label">上次清除时间</span>';
    html += '<span class="info-value' + (state.lastClearedAt ? '' : ' muted') + '">' +
      escapeHtml(formatTimestamp(state.lastClearedAt)) + '</span>';
    html += '</div>';
    html += '</div>';

    // 危险操作区
    html += '<div class="danger-zone">';
    html += '<div class="danger-title">危险操作</div>';
    html += '<div class="danger-desc">清除当前连接（' +
      (hasConn ? escapeHtml(state.hostPort) : '未连接') +
      '）的所有记忆。此操作不可恢复，清除后 Agent 将无法再 recall 这台机器之前的记忆。</div>';
    html += '<div class="danger-actions">';
    html += '<button class="btn btn-danger" id="clear-btn" type="button"' +
      (!hasConn || state.count === 0 || state.clearing ? ' disabled' : '') + '>清除当前连接所有记忆</button>';
    html += '</div>';
    // 二次确认条
    if (state.confirming) {
      html += '<div class="confirm-bar">';
      html += '<span class="confirm-bar-text">确认清除 ' + escapeHtml(state.hostPort) + ' 的所有记忆？共 ' +
        state.count + ' 条，清除后不可恢复。</span>';
      html += '<div class="confirm-bar-actions">';
      html += '<button class="btn" id="cancel-clear" type="button">取消</button>';
      html += '<button class="btn btn-danger" id="confirm-clear" type="button">确认清除</button>';
      html += '</div>';
      html += '</div>';
    }
    html += '</div>';

    // 状态提示条
    html += '<div class="status-bar" id="status-bar"></div>';

    elContent.innerHTML = html;

    // 绑定事件
    bindActions();
  }

  function bindActions() {
    const clearBtn = document.getElementById('clear-btn');
    if (clearBtn) clearBtn.addEventListener('click', function () {
      if (state.clearing) return;
      state.confirming = true;
      setStatus('', '');
      render();
    });

    const cancelBtn = document.getElementById('cancel-clear');
    if (cancelBtn) cancelBtn.addEventListener('click', function () {
      state.confirming = false;
      render();
    });

    const confirmBtn = document.getElementById('confirm-clear');
    if (confirmBtn) confirmBtn.addEventListener('click', performClear);
  }

  // ============ 清除流程 ============
  // 二次确认已展开 → 点击"确认清除"：
  // 1. fs.write 空字符串覆盖 memories/<host_port>.jsonl
  // 2. config.write 存"上次清除时间"到 config.json
  // 3. 刷新条数显示为 0 + 更新上次清除时间
  // 4. 显示成功提示
  // 5. 延迟后调 config.saved 关闭弹窗
  function performClear() {
    if (state.clearing) return;
    if (!state.hostPort) {
      setStatus('error', '没有当前连接，无法清除');
      return;
    }
    state.clearing = true;
    state.confirming = false;
    // 注意：render() 会重建 status-bar 元素，setStatus 必须在 render 之后
    render();
    setStatus('info', '正在清除…');

    const hostPort = state.hostPort;
    writeMemoriesFile(hostPort, '').then(function () {
      // 写入上次清除时间到 config.json
      return readConfig().then(function (config) {
        const now = Math.floor(Date.now() / 1000);
        if (!config.lastClearedAt || typeof config.lastClearedAt !== 'object') {
          config.lastClearedAt = {};
        }
        config.lastClearedAt[hostPort] = now;
        return writeConfig(config).then(function () {
          return now;
        });
      });
    }).then(function (now) {
      // 刷新本地状态
      state.count = 0;
      state.lastClearedAt = now;
      state.clearing = false;
      render();
      setStatus('success', '已清除全部记忆（' + hostPort + '）。');

      // 延迟后通知主应用关闭弹窗（让用户看到清除效果）
      setTimeout(function () {
        notifySavedAndClose().catch(function () {
          // 关闭失败不影响已完成的清除操作
          setStatus('warn', '清除已完成，但关闭弹窗失败，请手动关闭。');
        });
      }, 800);
    }).catch(function (err) {
      state.clearing = false;
      render();
      setStatus('error', '清除失败：' + (err && err.message ? err.message : err));
    });
  }

  // ============ 初始化 ============
  function loadAll() {
    return getCurrentConnection().then(function (conn) {
      state.host = conn.host;
      state.port = conn.port;
      state.hostPort = buildHostPort(conn);
      state.connName = conn.name;

      // 并行读取记忆条数与 config.json
      return Promise.all([
        readMemoriesFile(state.hostPort).then(function (text) {
          state.count = countJsonl(text);
        }, function () {
          // 文件不存在视为空
          state.count = 0;
        }),
        readConfig().then(function (config) {
          if (config.lastClearedAt && typeof config.lastClearedAt === 'object') {
            state.lastClearedAt = config.lastClearedAt[state.hostPort] || null;
          } else {
            state.lastClearedAt = null;
          }
        })
      ]);
    }, function (err) {
      // 没有活跃会话
      state.host = null;
      state.port = null;
      state.hostPort = null;
      state.connName = '';
      state.count = -1;
      state.lastClearedAt = null;
      throw err;
    }).then(function () {
      render();
    });
  }

  function init() {
    loadAll().then(function () {
      // 加载成功
    }).catch(function (err) {
      // 没有活跃会话或其他错误：渲染空状态信息
      render();
      setStatus('warn', '未检测到活跃的 SSH 连接。请先连接服务器再管理记忆。');
    });
  }

  // ============ 完成按钮：调 config.saved 关闭弹窗 ============
  document.getElementById('done-btn').addEventListener('click', function () {
    notifySavedAndClose().catch(function () {
      setStatus('warn', '关闭弹窗失败，请按 ESC 或点击遮罩关闭。');
    });
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
